databases:
  - name: expenses-db
    databaseName: expenses
    user: expenses
    plan: free

services:
  - type: web
    name: expenses-tracker-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CLIENT_ORIGIN
        value: https://shrenikyd.github.io
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: expenses-db
          property: connectionString
