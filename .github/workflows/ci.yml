name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Client tests
        run: npm test
        working-directory: client

      - name: Client build
        run: npm run build
        working-directory: client

  # The policies and the summary functions are the part of this app that a
  # mistake turns into someone else's money, so they run against a real
  # PostgreSQL rather than a mock.
  supabase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: supabase

      - name: Policy and function tests
        run: npm test
        working-directory: supabase
        env:
          ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
