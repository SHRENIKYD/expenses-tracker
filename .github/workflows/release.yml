name: Release

on:
  push:
    tags: ['v*']
  # Releasing from the Actions tab, for when tagging locally is awkward: the
  # runner makes the tag, which re-enters this workflow through the push above
  # and is why publishing has to be idempotent.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which version this is
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # A tag whose version does not match the one in package.json would ship a
      # build stamped with the wrong number, so it fails here instead.
      - name: The tag matches the version in package.json
        run: |
          version=$(node -p "require('./client/package.json').version")
          echo "releasing ${{ steps.release.outputs.version }}, package.json $version"
          test "${{ steps.release.outputs.version }}" = "$version"

      - name: The changelog has an entry for it
        run: |
          grep -q "^## ${{ steps.release.outputs.version }} " CHANGELOG.md \
            || { echo "CHANGELOG.md has no section for ${{ steps.release.outputs.version }}"; exit 1; }

      # Only when released from the Actions tab; a tag push already has one.
      - name: Tag the commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "$tag already exists"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='github-actions[bot]@users.noreply.github.com' \
                tag -a "$tag" -m "Tessera $tag"
            git push origin "$tag"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the changelog's own section, so there is one account
          # of what changed rather than two that can disagree.
          awk -v version="${{ steps.release.outputs.version }}" '
            $0 ~ "^## " version " " { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > /tmp/notes.md
          # A tag can arrive from a push or from the Releases page, which
          # creates the release itself. Either way the notes end up being the
          # changelog's.
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file /tmp/notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md
          fi
