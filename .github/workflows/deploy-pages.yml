name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so a build can tell whether it is a released commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      # A commit that carries a release tag is stamped with it; everything else
      # is stamped with the version in package.json and the commit it came from,
      # so a screenshot of a bug names the code that produced it.
      #
      # The tag is read from the commit rather than from the ref, because a tag
      # pushed by a workflow triggers nothing, and because a later push to main
      # would overwrite a build deployed from a tag anyway.
      - name: Work out the version
        id: version
        run: |
          version=$(node -p "require('./client/package.json').version")
          tag=$(git tag --points-at HEAD | grep '^v' | head -1 || true)
          if [ -n "$tag" ]; then
            echo "value=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "value=$version+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "building ${tag:-$version+${GITHUB_SHA::7}}"

      # A malformed URL builds and deploys perfectly happily and then fails in
      # the browser as ERR_NAME_NOT_RESOLVED, so the shape is checked here
      # rather than by whoever opens the site. A trailing comma once cost an
      # afternoon.
      - name: The Supabase URL is a URL
        run: |
          url="${{ vars.VITE_SUPABASE_URL }}"
          key="${{ vars.VITE_SUPABASE_ANON_KEY }}"
          printf '%s' "$url" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$' \
            || { echo "VITE_SUPABASE_URL is not a bare project URL: [$url]"; exit 1; }
          printf '%s' "$key" | grep -Eq '^(sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_.-]+)$' \
            || { echo "VITE_SUPABASE_ANON_KEY is not a publishable or anon key"; exit 1; }

      - name: Build
        run: npm run build
        working-directory: client
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          # The publishable key. It is meant to reach the browser — row-level
          # security, not secrecy, is what keeps one account out of another's
          # rows — so it is a variable rather than a secret. The secret key
          # (sb_secret_…) bypasses those policies and belongs in neither.
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}

      - name: The project URL reached the bundle
        run: |
          grep -rq "${{ vars.VITE_SUPABASE_URL }}" client/dist/assets \
            || { echo "VITE_SUPABASE_URL is missing from the bundle"; exit 1; }

      # GitHub Pages has no SPA fallback: without this, a deep link such as
      # /expenses-tracker/transactions returns a hard 404 on refresh.
      - name: Add SPA fallback
        run: cp client/dist/index.html client/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A green deploy says the files were published, not that the app works. This
  # calls the deployed page and the API it was built against, so a sleeping or
  # un-migrated API shows up here rather than on someone's phone.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The published page is served
        run: |
          url="${{ needs.deploy.outputs.page_url || 'https://shrenikyd.github.io/expenses-tracker/' }}"
          code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
          echo "GET $url -> $code"
          test "$code" = "200"
          grep -q '<div id="root">' /tmp/page.html

      - name: Deep links fall back to the app
        run: |
          url="${{ needs.deploy.outputs.page_url || 'https://shrenikyd.github.io/expenses-tracker/' }}transactions"
          # Pages answers an unknown path with 404.html — the app itself, under a
          # 404 status. What matters is that the app is served, not the status.
          code=$(curl -sS -o /tmp/deep.html -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$url")
          echo "GET $url -> $code"
          grep -q '<div id="root">' /tmp/deep.html
          grep -q 'manifest.webmanifest' /tmp/deep.html

      - name: The app is installable
        run: |
          base="${{ needs.deploy.outputs.page_url || 'https://shrenikyd.github.io/expenses-tracker/' }}"
          for file in manifest.webmanifest sw.js icon-192.png icon-512.png; do
            code=$(curl -sS -o /tmp/asset -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$base$file")
            echo "GET $base$file -> $code"
            test "$code" = "200"
          done
          grep -q '"start_url"' /tmp/asset || curl -sS "${base}manifest.webmanifest" | grep -q '"start_url"'
