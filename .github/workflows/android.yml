name: Android

on:
  workflow_dispatch:
    inputs:
      attach_to:
        description: 'Attach the apk to this release (e.g. v1.0.0); leave blank to only keep it as an artifact'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Work out the version
        id: version
        run: |
          version=$(node -p "require('./client/package.json').version")
          tag=$(git tag --points-at HEAD | grep '^v' | head -1 || true)
          echo "value=${tag:-$version+${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
          # An untagged build is named after its commit, so an apk attached to
          # a release cannot be mistaken for the release's own build.
          echo "name=tessera-${tag:-$version+${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      # The app ships its own copy of the client, so the base is relative rather
      # than the /<repo>/ that GitHub Pages needs, and VITE_TARGET keeps the
      # service worker out of a shell that is already on the device.
      - name: Build the web assets
        run: npm run build
        working-directory: client
        env:
          VITE_BASE: ./
          VITE_TARGET: capacitor
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}

      - name: The project url reached the bundle
        run: |
          grep -rq "${{ vars.VITE_SUPABASE_URL }}" client/dist/assets \
            || { echo "VITE_SUPABASE_URL is missing from the bundle"; exit 1; }

      - name: Copy them into the app
        run: npx cap sync android
        working-directory: client

      # A keystore of your own, if the repository has one: same signature every
      # build, so an apk installs over the last instead of demanding an
      # uninstall. Without the secrets the build is debug-signed and still
      # works — it just cannot update in place.
      - name: Take out the signing key
        id: signing
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tessera.jks"
          echo "path=$RUNNER_TEMP/tessera.jks" >> "$GITHUB_OUTPUT"

      - name: Build the apk
        env:
          TESSERA_KEYSTORE: ${{ steps.signing.outputs.path }}
          TESSERA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TESSERA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TESSERA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$TESSERA_KEYSTORE" ]; then
            echo "building a signed release apk"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/tessera.apk
          else
            echo "no keystore configured; building a debug apk"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/tessera.apk
          fi
        working-directory: client/android

      # A debug apk is signed with a throwaway key: enough to install and use,
      # not enough for the Play Store. Publishing needs a keystore of your own.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}-apk
          path: client/android/app/build/outputs/apk/tessera.apk
          if-no-files-found: error

      # An artifact expires and needs a GitHub login to fetch. A release asset
      # is a permanent, public link, which is what a phone actually needs.
      - name: Attach it to the release
        if: github.ref_type == 'tag' || inputs.attach_to != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="${{ inputs.attach_to }}"
          [ -n "$release" ] || release="$GITHUB_REF_NAME"
          cp client/android/app/build/outputs/apk/tessera.apk \
             "${{ steps.version.outputs.name }}.apk"
          gh release upload "$release" "${{ steps.version.outputs.name }}.apk" --clobber
